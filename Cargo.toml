[package]
name = "otpc"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
crossterm = "0.29.0"
google_authenticator_converter = "0.2.0"
homedir = "0.3.6"
keyring = "4.2.0"
rxing = { version = "0.9.2", default-features = false, features = ["image", "image_formats", "encoding_rs", "decoders", "qrcode"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tui-input = { version = "0.15.4", default-features = false, features = ["crossterm"] }
urlencoding = "2.1.3"
xcap = "0.9.8"


[dependencies.totp-rs]
version = "6.0.0"
features = ["otpauth"]
